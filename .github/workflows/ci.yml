name: CI

# Checks pull requests (including Dependabot's). It has no AWS access and no secrets, so it is
# safe to run on pull requests from forks.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Synthesize the CDK stack
        run: |
          cp infra/config.example.json infra/config.json
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk synth -q
